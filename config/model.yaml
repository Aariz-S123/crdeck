# Model, search and warning settings (spec sections 7 and 8). Starting points, not validated choices.
seed: 42

synergy:
  k: 50                # shrinkage strength toward the global win rate
  min_games: 200       # fewer pair games -> INSUFFICIENT_SAMPLE
  interval: 0.90
  # "auto" (default): pick on the validation window between "without_partner" and
  # "marginal" (spec literal; double-counts pair effects when cards almost always
  # co-occur). On synthetic data without_partner won; on the first real window the
  # two were within 0.003 AUC. See src/crdeck/synergy.py and docs/model-notes.md.
  expected_from: auto

strength:
  C_grid: [0.00003, 0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0]   # L2 strength chosen on validation log loss
  skill_control: true     # rating difference as a covariate; card weights and deck scores are at equal rating
  max_iter: 5000
  min_feature_games: 20   # card:form features seen fewer times in train are dropped
  top_n_pairs: 100        # pair features for the second model

deck_score:
  n_opponent_decks: 2000  # sampled from the test window
  n_bootstrap: 200
  interval: 0.90

search:
  beam_width: 50
  beam_parents_min: 10    # each parent keeps at most beam_width / this many children per step
  synergy_weight: 0.5     # objective = meta_win_prob + synergy_weight * mean_pair_synergy
  # + w * mean_log_lift. Rule (evaluate.choose_cooccurrence): smallest grid value whose
  # VALIDATION completion recall reaches 95% of the best validation recall. Real window
  # 2026-10-w3: 0.05 (valid recall 0.925; best 0.967). The rule was revised after seeing test
  # results (docs/model-notes.md); re-check on each new collection window with notebook 06.
  cooccurrence_weight: 0.05
  n_results: 3
  min_diff_cards: 2       # returned decks differ by at least this many cards
  min_card_games: 50      # candidate cards need this many train appearances
  top_swaps: 3
  require_win_condition: false   # hard filter toggle (off by default, spec 7.4)

archetype:
  uncertain_threshold: 0.5
  C: 1.0
  n_clusters: 12
  per_cluster: 8
  heldout_target: 20      # first 20 labels go to the held-out split (label them before fitting anything)

warnings:
  elixir_min: 2.6
  elixir_max: 4.5
  narrow_roles: [big_spell, tank, building]

forecast:
  # Meta history and Monte Carlo forecast (src/crdeck/forecast.py). Shown only after a backtest.
  n_boot: 300              # bootstrap resamples of battles per collection period
  runs: 2000               # Monte Carlo runs
  min_games: 200           # card forms below this many appearances in a period are not scored
  first_period_hours: 24   # the first collection has no previous fetch: use the 24 h before it

matchup:
  # Card-vs-card matchup model for the counter search (src/crdeck/matchup.py). Adds one weight per
  # common card-vs-card pairing to the card weights; settings chosen on validation log loss.
  min_pair_battles: 500    # a pairing needs this many training battles (cards on opposite sides) to get a weight
  C_grid: [0.003, 0.01, 0.03]   # Ranked 2026-10-24: 0.001..0.1 tried, 0.01 best; neighbours kept to bound export time
  max_iter: 3000
  opponents_per_set: 40    # most-played test-window decks used to stand for a deck style or a set of opponent cards
  n_results: 3             # counter decks returned
  top_cards: 10            # counter cards listed
