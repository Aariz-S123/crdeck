# Balance calendar: when cards changed, by official notes first and community trackers second.
# Read and checked by src/crdeck/balance/events.py. This folder is outside the model cache fingerprint
# (crdeck.pipeline._fingerprint reads config/*.yaml only), so editing it never forces a retrain.
#
# Rules (docs/fable-brief/BLUEPRINT.md 6.2 and 6.3):
# - A card name must match data/labels/cards.csv exactly. An unknown name is an error, never a guess.
# - form: all (the notes name no form: the change is taken to reach every form, an assumption the notes state as
#   "most of the time"), or base | evo | hero when the notes name one.
# - label: nerf | buff | rework | fix | addition, the heading the entry sits under in the notes.
# - scoreable: true only for an official page with dated sections. Community entries are never scored.
# - reason: only words read from the official page itself. Left out when the page was read through a summary.
# - partial: true when the entry list was read from a listing that may not show every card.
# Bump `version` on any edit.
version: 1

# The official blog list (https://supercell.com/en/games/clashroyale/blog/, first page) was read on this date and
# showed no balance post dated after 2026-10-27. The release-notes index address itself answered HTTP 404.
checked_on: 2026-11-16
checked_note: "Official blog list, first page: no balance post after 2026-10-27. Release-notes index answered 404."

