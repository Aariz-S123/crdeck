# Future meta recommender (src/crdeck/futuremeta, scripts/future_meta.py). Every value is fixed by
# docs/future-meta/DESIGN.md before any result. This folder is outside the model cache fingerprint.
seed: 42

periods:
  min_battles: 5000        # smaller periods merge into the next one
  first_period_hours: 24   # the first collection has no previous fetch, as in config/model.yaml

forecast:
  min_games: 200           # a card form is scored with this many appearances in the period ending at the origin
  min_hour_appearances: 200  # hours with fewer are gaps in the hourly series
  min_known_battles: 5000  # an origin knowing fewer battles of its latest period is not a forecast time, and is skipped
  horizons: 3              # periods ahead
  runs: 2000
  independent_part: 0.25   # share of each draw's variance that is independent of past misses
  live_hours_per_step: 24  # the live forecast's future steps

timesfm:
  repo: google/timesfm-2.5-200m-pytorch
  max_context: 512
  max_horizon: 256
  batch_size: 32

matchup:
  C: 0.01                  # from the 2026-10-24 selection (config/model.yaml); fixed, not re-chosen per origin

decks:
  min_games_candidate: 30  # OK games over the last `candidate_periods` periods before the origin
  candidate_periods: 3
  min_games_tau: 30        # decks with this many games set the empirical-Bayes spread
  top: 10                  # primary list length
  top_secondary: 30
  min_diff: 2              # listed decks differ by at least this many cards
  min_games_judge: 200     # fewer primary-population games in a compared list: too few to judge
  min_games_range_check: 20
  bootstrap: 2000

# Things that happened in the game, as observed in the data. Shown on the page when they fall in the newest period.
events:
  - time: "2026-11-02T09:00:00Z"
    text: "A new season appears to have started around 09:00 UTC on 2026-11-02: player ratings vanished from battle logs at that hour, a new Evolution appeared, and later that day the Path of Legends leaderboards came back empty on all 13 boards."

quality:
  min_games: 30            # OK games in period t for a deck to enter
  min_games_next: 10       # OK games in period t+1 for the edge target
  ridge_alpha: 10.0
  min_train_transitions: 2
  bootstrap: 1000
