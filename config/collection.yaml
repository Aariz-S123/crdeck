# Data collection settings (spec sections 3 and 6).
api:
  base_url: https://api.clashroyale.com/v1
  key_env: CR_API_KEY          # read from .env; never printed
  request_delay_s: 0.15        # fixed delay between requests
  max_retries: 5
  backoff_base_s: 2.0          # exponential backoff on 429 / 5xx
  timeout_s: 20

# Raw responses are cached under data/raw/<window.id>/. A new collection window
# gets a new id; files already present for the same id are never re-fetched.
window:
  id: "2026-10-w3"
  start: null                  # optional UTC ISO filter on battle_time, e.g. "2026-10-01T00:00:00Z"
  end: null

leaderboard:
  # Observed working 2026-10-18: /locations/{id}/pathoflegend/players (global and country ids).
  location_id: global
  season_id: null              # null -> /locations/{id}/pathoflegend/players
  limit: 1000
  # Extra regional Path of Legends leaderboards (location id: how many top players).
  # Players already on the global list are skipped. Ids from GET /locations.
  extra_locations:
    57000249: 200   # United States
    57000038: 200   # Brazil
    57000153: 200   # Mexico
    57000218: 200   # Spain
    57000094: 200   # Germany
    57000087: 200   # France
    57000120: 200   # Italy
    57000122: 200   # Japan
    57000193: 200   # Russia
    57000239: 200   # Turkey
    57000248: 200   # United Kingdom
    57000113: 200   # India

battles:
  # Modes, matched on battle `type` + `gameMode.name` + `deckSelection`. Determined from the
  # collected logs on 2026-10-19 (inventory in docs/api-notes.md). Battles that match no mode
  # (events, draft, friendlies, clan war, 2v2, tournaments) get status FILTERED_TYPE and are
  # never modeled: their decks are not the player's own choice or the rules differ.
  #
  # Each mode is also split into groups (the site's League / Arena picker):
  #   group_by: league -> the battle's `leagueNumber` (observed on every pathOfLegend battle, 2026-10-19)
  #   group_by: arena  -> the battle's `arena.name`
  # The names, order and trophy floors below were supplied by the project owner on 2026-10-20.
  # They order the picker and aim the arena collector; a battle's group always comes from the
  # battle itself, never from these numbers.
  modes:
    ranked:
      label: "Ranked (Path of Legends)"
      types: [pathOfLegend]
      game_modes: [Ranked1v1_NewArena, Ranked1v1_NewArena2]
      group_by: league
      group_word: League
      leagues:                     # leagueNumber: name
        1: Master I
        2: Master II
        3: Master III
        4: Champion
        5: Grand Champion
        6: Royal Champion
        7: Ultimate Champion
    trophy_road:
      label: "Trophy Road ladder"
      types: [trail, PvP]
      game_modes: [Ladder]
      group_by: arena
      group_word: Arena
      arenas:                      # [name, trophies needed]; game order
        - ["Goblin Stadium", 0]
        - ["Bone Pit", 300]
        - ["Barbarian Bowl", 600]
        - ["Spell Valley", 1000]
        - ["Builder's Workshop", 1300]
        - ["P.E.K.K.A's Playhouse", 1600]
        - ["Royal Arena", 2000]
        - ["Frozen Peak", 2300]
        - ["Jungle Arena", 2600]
        - ["Hog Mountain", 3000]
        - ["Electro Valley", 3400]
        - ["Spooky Town", 3800]
        - ["Rascal's Hideout", 4200]
        - ["Serenity Peak", 4600]
        - ["Miner's Mine", 5000]
        - ["Executioner's Kitchen", 5500]
        - ["Royal Crypt", 6000]
        - ["Silent Sanctuary", 6500]
        - ["Dragon Spa", 7000]
        - ["Boot Camp", 7500]
        - ["Clash Fest", 8000]
        - ["PANCAKES!", 8500]
        - ["Valkalla", 9000]
        - ["Legendary Arena", 9500]
        - ["Lumberlove Cabin", 10000]
        - ["Royal Road", 10500]
        - ["Musketeer Street", 11000]
        - ["Summit of Heroes", 11500]
        - ["Magic Academy", 12000]
        - ["Ultimate Clash Pit", 12500]
        - ["Little Prince's Tavern", 13000]
        - ["Spirit Square", 13500]
        # Not in the owner's table; floors are the lowest startingTrophies seen in collected
        # Seasonal Arena battles (2026-10-19: 14,000 and 14,500).
        - ["Seasonal Arena I", 14000]
        - ["Seasonal Arena II", 14500]
  deck_selection: [collection]   # the player's own deck
  combined:
    all: [ranked, trophy_road]   # "All" = every modeled mode together

# Players for lower arenas (`python -m crdeck collect --arenas`). Leaderboards only list top
# players, so the collector finds clans through GET /clans, reads their member lists (each
# member's own arena), and fetches battle logs for up to `players_per_arena` members per arena.
# Observed 2026-10-20: a search by locationId returns the strongest clans first (scores
# 81k-140k, members at 14,000 trophies) and stops after about 1,000 results, so it never
# reaches low arenas. A search by name returns about 640 clans per word across the whole
# score range (about 20k to 140k), and low-score clans hold low-arena members. So the
# collector searches by common name words and visits clans with the lowest score per member first.
# Arenas still short after the clan pass are filled from the ladder opponents in logs already
# fetched. These logs go to data/raw/<window>/battlelog_arena/ and are tagged
# sample = "arena_sample"; the meta history keeps using the leaderboard sample only.
arena_sample:
  players_per_arena: 150
  max_requests: 9000             # hard stop for one run
  clan_search:
    names: [clash, royale, king, kings, royal, war, legends, team, family, army, elite, noob, pro, the, fun, dragons, warriors, empire, squad, friends]
    min_members: 5
    limit: 50                    # clans per search page
    max_pages: 13                # pages per name (the API stops near 640 results)
  snowball: true                 # fill short arenas from ladder opponents

form_resolution:
  # Observed in real calls on 2026-10-18 (docs/api-notes-observed.md, docs/api-notes.md):
  # battle-deck cards carry evolutionLevel 1 = Evolution form, 2 = Hero form, absent = base.
  form_field: evolutionLevel
  form_values: {1: evo, 2: hero}
  # Observed: deck position 0 = Evolution slot, 1 = Hero slot, 2 = Wild slot, 3-7 normal.
  # Set to {} if a future API change breaks this; slots are then recorded as "unknown".
  slot_positions: {0: evo, 1: hero, 2: wild}

split:
  train_frac: 0.70
  valid_frac: 0.15             # remainder is the test window
