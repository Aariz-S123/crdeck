[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crdeck"
version = "0.1.0"
description = "Clash Royale ML deck builder (solo learning project; not affiliated with Supercell)"
requires-python = ">=3.12"

[project.scripts]
crdeck = "crdeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
